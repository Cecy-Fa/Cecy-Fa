<text x="34" y="66" font-size="28" font-weight="700" fill="#FFF5FB" text-anchor="start">Videojuegos</text><text x="34" y="100" font-size="15" fill="#FFB3D9" text-anchor="start" font-weight="400"><tspan x="34" dy="0">Diseño y programo juegos:</tspan><tspan x="34" dy="21.8">naves espaciales, combates</tspan><tspan x="34" dy="21.8">y desafíos de lógica.</tspan></text><g transform="translate(290 34)"><rect width="104" height="38" rx="8" fill="#171323" fill-opacity=".55" stroke="#F052B5" stroke-width="1.8" filter="url(#glowgrid)"/><text x="52.0" y="25.0" font-size="16" fill="#FFF5FB" text-anchor="middle" font-weight="600">Jugar</text></g><g transform="translate(100 228) scale(1.0)"><circle r="58" fill="#F052B5" opacity=".18" filter="url(#halogrid)"/><g filter="url(#glowgrid)"><path d="M-50 -10 Q-50 -30 -30 -30 H30 Q50 -30 50 -10 L58 25 Q62 42 46 42 Q36 42 28 28 H-28 Q-36 42 -46 42 Q-62 42 -58 25 Z" fill="none" stroke="#F052B5" stroke-width="4" stroke-linejoin="round"/><path d="M-34 -2 H-18 M-26 -10 V6" stroke="#FFB3D9" stroke-width="5" stroke-linecap="round"/><circle cx="26" cy="-12" r="4.5" fill="#FFB3D9"/><circle cx="36" cy="-2" r="4.5" fill="#FFB3D9"/><circle cx="26" cy="8" r="4.5" fill="#FFB3D9"/><circle cx="16" cy="-2" r="4.5" fill="#FFB3D9"/></g></g><text x="796" y="66" font-size="28" font-weight="700" fill="#FFF5FB" text-anchor="end">Diseño UI/UX</text><text x="796" y="100" font-size="15" fill="#FFB3D9" text-anchor="end" font-weight="400"><tspan x="796" dy="0">Interfaces claras, cuidadas</tspan><tspan x="796" dy="21.8">y con mucha personalidad,</tspan><tspan x="796" dy="21.8">pensadas para quien las usa.</tspan></text><g transform="translate(436 34)"><rect width="104" height="38" rx="8" fill="#171323" fill-opacity=".55" stroke="#F052B5" stroke-width="1.8" filter="url(#glowgrid)"/><text x="52.0" y="25.0" font-size="16" fill="#FFF5FB" text-anchor="middle" font-weight="600">Diseñar</text></g><g transform="translate(730 228) scale(1.0)"><circle r="58" fill="#F052B5" opacity=".18" filter="url(#halogrid)"/><g filter="url(#glowgrid)"><path d="M0 -42 C36 -42 54 -16 48 6 C43 24 22 16 15 27 C8 38 22 46 0 46 C-32 46 -52 22 -52 0 C-52 -25 -29 -42 0 -42Z" fill="none" stroke="#F052B5" stroke-width="4"/><circle cx="-28" cy="4" r="7" fill="#FF80BF"/><circle cx="-20" cy="-20" r="7" fill="#D946EF"/><circle cx="4" cy="-26" r="7" fill="#B44AFF"/><circle cx="26" cy="-12" r="7" fill="#FFB3D9"/></g></g><text x="34" y="376.0" font-size="28" font-weight="700" fill="#FFF5FB" text-anchor="start">Desarrollo Web</text><text x="34" y="410.0" font-size="15" fill="#FFB3D9" text-anchor="start" font-weight="400"><tspan x="34" dy="0">Creo, personalizo y optimizo</tspan><tspan x="34" dy="21.8">páginas web modernas.</tspan></text><g transform="translate(100 522.0) scale(1.0)"><circle r="58" fill="#F052B5" opacity=".18" filter="url(#halogrid)"/><g filter="url(#glowgrid)"><rect x="-55" y="-40" width="110" height="82" rx="10" fill="none" stroke="#F052B5" stroke-width="4"/><path d="M-55 -20 H55" stroke="#F052B5" stroke-width="3"/><circle cx="-42" cy="-30" r="3.5" fill="#FFB3D9"/><circle cx="-31" cy="-30" r="3.5" fill="#FFB3D9"/><circle cx="-20" cy="-30" r="3.5" fill="#FFB3D9"/><path d="M-14 0 L-28 12 L-14 24 M14 0 L28 12 L14 24 M5 -4 L-5 28" fill="none" stroke="#FFB3D9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(232 558)"><rect width="104" height="38" rx="8" fill="#171323" fill-opacity=".55" stroke="#F052B5" stroke-width="1.8" filter="url(#glowgrid)"/><text x="52.0" y="25.0" font-size="16" fill="#FFF5FB" text-anchor="middle" font-weight="600">Crear</text></g><text x="796" y="376.0" font-size="28" font-weight="700" fill="#FFF5FB" text-anchor="end">Innovación</text><text x="796" y="410.0" font-size="15" fill="#FFB3D9" text-anchor="end" font-weight="400"><tspan x="796" dy="0">Exploro nuevas tecnologías</tspan><tspan x="796" dy="21.8">y herramientas en constante</tspan><tspan x="796" dy="21.8">aprendizaje.</tspan></text><g transform="translate(730 526.0) scale(1.0)"><circle r="58" fill="#F052B5" opacity=".18" filter="url(#halogrid)"/><g filter="url(#glowgrid)"><path d="M-24 6 A32 32 0 1 1 24 6 C16 15 13 20 13 28 H-13 C-13 20 -16 15 -24 6Z" fill="none" stroke="#F052B5" stroke-width="4" stroke-linejoin="round"/><path d="M-11 36 H11 M-7 44 H7" stroke="#F052B5" stroke-width="4" stroke-linecap="round"/><path d="M-8 -6 L0 6 L8 -6" fill="none" stroke="#FFB3D9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-52 -22 L-42 -18" stroke="#FFB3D9" stroke-width="3.5" stroke-linecap="round"/><path d="M52 -22 L42 -18" stroke="#FFB3D9" stroke-width="3.5" stroke-linecap="round"/><path d="M0 -64 V-54" stroke="#FFB3D9" stroke-width="3.5" stroke-linecap="round"/><path d="M-38 -52 L-31 -44" stroke="#FFB3D9" stroke-width="3.5" stroke-linecap="round"/><path d="M38 -52 L31 -44" stroke="#FFB3D9" stroke-width="3.5" stroke-linecap="round"/></g></g><g transform="translate(494 558)"><rect width="104" height="38" rx="8" fill="#171323" fill-opacity=".55" stroke="#F052B5" stroke-width="1.8" filter="url(#glowgrid)"/><text x="52.0" y="25.0" font-size="16" fill="#FFF5FB" text-anchor="middle" font-weight="600">Aprender</text></g>
